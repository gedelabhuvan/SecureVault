spring.datasource.url=jdbc:h2:mem:securevaulttest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

securevault.encryption-key=TXlTZWN1cmVWYXVsdEtleTEyMzQ1Njc4OTAxMjM0NTY=

jwt.secret=SecureVaultJWTSecretKeyForDevelopmentOnlyChangeThisKey123456789
jwt.expiration=86400000

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
spring.cache.type=simple